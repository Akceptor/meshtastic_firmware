; Shared base for ExpressLRS "Generic C3 LR1121" single-radio RX modules repurposed as Meshtastic
; nodes (ESP32-C3 + LR1121, dual-band). Each board's own platformio.ini does:
;   extends = elrs_lr1121_rx_base
; then sets only what is board-specific: hw_model / slug / display name, which rfswitch_*.h table
; to use (via -I of a dir that shadows rfswitch.h, or -DELRS_RFSW_* include), and the PA power cap.
;
; Everything common lives here: the shared pinout header dir, the TRX-firmware accept script, and
; the module excludes that keep a headless BLE+LoRa text node small (no dual-boot partition table in
; this variant -- the board uses the stock single-boot Meshtastic layout inherited from esp32c3_base).

[elrs_lr1121_rx_base]
extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = pr
extra_scripts =
  ${env.extra_scripts}
  pre:extra_scripts/lr11x0_accept_trx_firmware.py
build_flags =
  ${esp32c3_base.build_flags}
  ; Shared pinout for all Generic C3 LR1121 single-radio boards
  -I variants/esp32c3/elrs_lr1121_rx
  ; RadioLib: only LR11x0 (LR1121) needed, these boards have no SX127x/SX128x/LR2021
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  ; No GPS hardware
  -D MESHTASTIC_EXCLUDE_GPS=1
  ; No sensors
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -D MESHTASTIC_EXCLUDE_MAGNETOMETER=1
  ; No audio hardware
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  ; --- Size trim: these are headless BLE+LoRa text nodes (a bare RX module), so drop everything
  ; they can't use. Kept lean so the firmware also fits the 1.9MB slot of the ElrsDual dual-boot
  ; layout used in other builds, though this variant itself uses the stock single-boot partitions.
  ; (SCREEN and I2C excludes are deliberately NOT used: they trip upstream guard bugs in
  ; MotionSensor/InputBroker, and the budget is met without them.) ---
  ; No WiFi radio exposed; these pull in the whole TCP/IP + web stack
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_EXCLUDE_SOCKETAPI=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  ; No sensors of any kind on these boards
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  ; Niche modules not needed for a basic ExpressLRS mesh node
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
