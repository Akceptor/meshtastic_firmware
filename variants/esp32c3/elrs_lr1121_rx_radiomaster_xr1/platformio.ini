[env:elrs-lr1121-rx-radiomaster-xr1]
custom_meshtastic_hw_model = 153
custom_meshtastic_hw_model_slug = RADIOMASTER_XR1_LR1121_RX
custom_meshtastic_architecture = esp32-c3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = RadioMaster XR1 LR1121 RX
custom_meshtastic_tags = ExpressLRS

extends = elrs_lr1121_rx_base
build_flags =
  ${elrs_lr1121_rx_base.build_flags}
  -DRADIOMASTER_XR1_LR1121_RX
  ; Board dir must precede the common -I so this board's variant.h/rfswitch.h shims win
  -I variants/esp32c3/elrs_lr1121_rx_radiomaster_xr1
  ; Sub-GHz HIGH-POWER PA, +22dBm. RadioLib hard-caps the LR1121 HP PA at +22dBm -- a higher
  ; value makes begin() return -13 INVALID_OUTPUT_POWER; a lower one silently keeps the radio
  ; on the weaker LP PA. (RF-switch table derived from the ExpressLRS layout; NOT yet verified
  ; on hardware -- only HGLRC boards were available to test.)
  -DLR1110_MAX_POWER=22
