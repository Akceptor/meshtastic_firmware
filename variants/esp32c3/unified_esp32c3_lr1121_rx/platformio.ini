[env:unified_esp32c3_lr1121_rx]
custom_meshtastic_hw_model = 146
custom_meshtastic_hw_model_slug = UNIFIED_ESP32C3_LR1121_RX
custom_meshtastic_architecture = esp32-c3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Unified ESP32-C3 LR1121 RX
custom_meshtastic_tags = ExpressLRS

extends = esp32c3_base
board = esp32-c3-devkitm-1
; Dual-boot with stock ExpressLRS via ElrsDual's slot-switch bootloader
board_build.partitions = variants/esp32c3/unified_esp32c3_lr1121_rx/partitions-dual.csv
extra_scripts =
  ${esp32c3_base.extra_scripts}
  pre:extra_scripts/lr11x0_accept_trx_firmware.py
build_flags =
  ${esp32c3_base.build_flags}
  -DUNIFIED_ESP32C3_LR1121_RX
  ; ExpressLRS runs this board's sub-GHz side on the LR1121's HIGH-POWER PA at up to
  ; +22dBm (Generic C3 LR1121.json: power_values [12,16,19,22], power_max 3, and no
  ; radio_rfo_hf, which is what selects PA_SEL_HP in LR1121Driver::SetPaConfig). RadioLib
  ; only switches from the low-power PA to the high-power one above 14dBm, so a lower cap
  ; here silently leaves the radio on the LP PA: ~8dB down, with Semtech's HP-optimized
  ; PaDutyCycle applied to the LP PA on top of that. Receive is unaffected, so it presents
  ; as "hears everything, nobody hears it".
  -DLR1110_MAX_POWER=22
  -I variants/esp32c3/unified_esp32c3_lr1121_rx
  ; RadioLib: only LR11x0 (LR1121) needed, this board has no SX127x/SX128x/LR2021
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  ; No GPS hardware
  -D MESHTASTIC_EXCLUDE_GPS=1
  ; No sensors
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -D MESHTASTIC_EXCLUDE_MAGNETOMETER=1
  ; No audio hardware
  -D MESHTASTIC_EXCLUDE_AUDIO=1
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
