[env:bayckrc_gemini_rx]
custom_meshtastic_hw_model = 150
custom_meshtastic_hw_model_slug = BAYCKRC_GEMINI_RX
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = BAYCKRC Dual Band Gemini RX
custom_meshtastic_tags = BAYCKRC, ExpressLRS

extends = esp32_base
board = esp32doit-devkit-v1
; Dual-boot with stock ExpressLRS via ElrsDual's slot-switch bootloader
board_build.partitions = variants/esp32/bayckrc_gemini_rx/partitions-dual.csv
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:extra_scripts/lr11x0_accept_trx_firmware.py
build_flags =
  ${esp32_base.build_flags}
  -DBAYCKRC_GEMINI_RX
  ; No external PA: ELRS runs sub-GHz on the HP PA up to +22dBm (power_values [12,16,19,22]).
  ; RadioLib only picks the HP PA above 14dBm, so a lower cap leaves TX ~8dB down.
  -DLR1110_MAX_POWER=22
  -I variants/esp32/bayckrc_gemini_rx
  ; RadioLib: only LR11x0 (LR1121) needed
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  ; No I2C bus; default Wire pins 21/22 are radio_rst_2 and the NeoPixel, and the boot scan can hang
  -D MESHTASTIC_EXCLUDE_I2C=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  ; No GPS hardware
  -D MESHTASTIC_EXCLUDE_GPS=1
  ; No sensors
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -D MESHTASTIC_EXCLUDE_MAGNETOMETER=1
  ; No audio hardware
  -D MESHTASTIC_EXCLUDE_AUDIO=1
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
