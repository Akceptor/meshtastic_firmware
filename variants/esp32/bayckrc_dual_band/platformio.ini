[env:bayckrc_dual_band]
custom_meshtastic_hw_model = 145
custom_meshtastic_hw_model_slug = BAYCKRC_DUAL_BAND
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = BAYCKRC Dual Band TX
custom_meshtastic_tags = BAYCKRC, ExpressLRS

extends = esp32_base
board = esp32doit-devkit-v1
build_flags =
  ${esp32_base.build_flags}
  -DBAYCKRC_DUAL_BAND
  -DVTABLES_IN_FLASH=1
  -DCONFIG_DISABLE_HAL_LOCKS=1
  -O2
  -I variants/esp32/bayckrc_dual_band
board_build.f_cpu = 240000000L
upload_protocol = esptool
upload_speed = 460800
